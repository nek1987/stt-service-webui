version: '3.8'
services:
  stt-service:
    build: ./stt-service
    runtime: nvidia
    ports:
      - "5085:5085"
    environment:
      - MODEL_PATH=/models/islomov_navaistt_v2_medium_ct2
      - NVIDIA_VISIBLE_DEVICES=0
      # API authentication: use API_TOKENS for multiple keys (comma-separated) or API_TOKEN for single key
      # Example: API_TOKENS=token-alpha,token-bravo,token-charlie
      - API_TOKENS=${API_TOKENS}
      - API_TOKEN=${API_TOKEN}
    # <<< УДАЛЕНО секцию healthcheck

  webui-service:
    build: ./webui-service
    ports:
      - "7860:7860"
    environment:
      - STT_API=http://stt-service:5085/transcribe
      - API_TOKEN=${API_TOKEN}
      - UI_USER=${UI_LOGIN}
      - UI_PASS=${UI_PASS}
    depends_on:
      - stt-service   # простая зависимость, без проверки здоровья
